name: Release

on:
  workflow_dispatch:
    inputs:
      incrementer:
        description: 'Version increment type'
        required: true
        default: 'incrementPatch'
        type: choice
        options:
          - incrementPatch
          - incrementMinor
          - incrementMajor

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and Test
        run: ./gradlew build

      - name: Create Release Tag
        run: ./gradlew createRelease -Prelease.incrementer=${{ inputs.incrementer }} -Prelease.disableChecks

      - name: Publish to Maven Central
        # Releases go to Central (GitHub Packages dropped — task removed with the build.gradle migration).
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishAllPublicationsToCentralPortal

      - name: Push Release Tag
        run: |
          git push origin main
          git push --tags

      - name: Get version
        id: version
        run: echo "version=$(./gradlew -q currentVersion | grep 'Project version' | awk '{print $3}')" >> $GITHUB_OUTPUT

      - name: Create Forgejo Release
        # Forgejo-native release object via its API. softprops/action-gh-release calls
        # github.com-only endpoints (generate-notes 404s on Forgejo). Non-fatal: the real
        # release is the Maven Central publish + the pushed tag above.
        run: |
          curl -fsS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"tag_name":"v${{ steps.version.outputs.version }}","name":"Release ${{ steps.version.outputs.version }}"}' \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases" \
            && echo "Forgejo release object created" || echo "release-object creation skipped (non-fatal)"
