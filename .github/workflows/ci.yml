name: CI/Snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build and Test
        run: ./gradlew build --configuration-cache

      - name: Upload test results
        if: always()
        continue-on-error: true   # belt-and-suspenders: never fail the build over artifacts
        # Forgejo-native fork; v4+ of actions/upload-artifact is unsupported on Forgejo (GHES).
        uses: https://code.forgejo.org/forgejo/upload-artifact@v3
        with:
          name: test-results
          path: build/reports/tests/

  publish-snapshots:
    name: Publish Snapshots
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Publish snapshots to Forgejo
        env:
          # The auto-injected Actions token CANNOT write the Forgejo package registry, so
          # publishing uses the CICD_TOKEN org secret (a Forgejo PAT with write:package).
          FORGEJO_ACTOR: ${{ github.actor }}
          FORGEJO_TOKEN: ${{ secrets.CICD_TOKEN }}
        run: ./gradlew publishAllPublicationsToForgejoRepository --no-daemon
