name: CI/Snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and Test
        run: ./gradlew build --configuration-cache

      - name: Upload test results
        if: always()
        continue-on-error: true   # Forgejo artifact backend may be unavailable; don't fail the build over it
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/

  publish-snapshots:
    name: Publish Snapshots
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish snapshots to Forgejo
        env:
          # On Forgejo Actions the injected token is a Forgejo token with package:write,
          # so resolution + publish to the Forgejo registry need no extra secret.
          FORGEJO_ACTOR: ${{ github.actor }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToForgejoRepository --no-daemon --configuration-cache
